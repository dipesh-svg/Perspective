name: Frontend CI

on:
  push:
    branches: ["main"]
    paths: ["frontend/**", "PRIVACY.md", "TERMS.md", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["frontend/**", "PRIVACY.md", "TERMS.md", ".github/workflows/frontend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage (90% threshold)
        run: npm run test:coverage

      - name: Build static export
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start the frontend dev server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/perspective-next.log 2>&1 &
          echo $! > /tmp/perspective-next.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/en > /dev/null; then
              echo "Frontend is ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/perspective-next.log
          exit 1

      - name: Run Cypress end-to-end tests
        run: npm run test:e2e

      - name: Stop the frontend dev server
        if: always()
        run: |
          if [ -f /tmp/perspective-next.pid ]; then
            kill "$(cat /tmp/perspective-next.pid)" 2>/dev/null || true
          fi
